name: Build and release DoviFuse

on:
  push:
    branches:
      - main

  pull_request:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Build release or release with additional acceptance verification
        type: choice
        options:
          - build
          - validated
        default: build

concurrency:
  group: dovifuse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOVI_TOOL_REV: b25558062e4a56973482ec70133bd7b891320e48

jobs:
  fixtures:
    name: Prepare shared synthetic fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore prepared synthetic media
        id: fixtures-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/dovifuse-ci-fixtures
          key: dovifuse-fixtures-v1-${{ env.DOVI_TOOL_REV }}-${{ hashFiles('scripts/prepare_ci_fixtures.sh', 'scripts/audit_fixtures.py', 'scripts/test_donor_eligibility.py', 'scripts/test_picture_coverage.py', 'scripts/test_temporal_local_edits.py', 'tests/fixtures/*.json') }}
      - name: Fetch pinned fixture authoring source
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: quietvoid/dovi_tool
          ref: ${{ env.DOVI_TOOL_REV }}
          path: dovi_tool
      - name: Install fixture authoring tools
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mkvtoolnix mediainfo
      - name: Author all disposable media
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --release --manifest-path dovi_tool/Cargo.toml --no-default-features --features internal-font
          mkdir -p tools
          ln -s ../dovi_tool/target/release/dovi_tool tools/dovi_tool
          ln -s /usr/bin/ffmpeg tools/ffmpeg
          ./scripts/prepare_ci_fixtures.sh /tmp/dovifuse-ci-fixtures
      - name: Save prepared synthetic media
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/dovifuse-ci-fixtures
          key: ${{ steps.fixtures-cache.outputs.cache-primary-key }}
      - name: Share only prepared test media
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mechanics-fixtures
          path: |
            /tmp/dovifuse-ci-fixtures/manifest.json
            /tmp/dovifuse-ci-fixtures/*.mkv
            /tmp/dovifuse-ci-fixtures/donor-eligibility/manifest.json
            /tmp/dovifuse-ci-fixtures/donor-eligibility/*.mkv
            /tmp/dovifuse-ci-fixtures/picture-coverage/manifest.json
            /tmp/dovifuse-ci-fixtures/picture-coverage/*.mkv
            /tmp/dovifuse-ci-fixtures/temporal-local/manifest.json
            /tmp/dovifuse-ci-fixtures/temporal-local/*.mkv
          if-no-files-found: error

  linux:
    name: Linux regression gates
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dovi_tool source and reference metadata
        uses: actions/checkout@v4
        with:
          repository: quietvoid/dovi_tool
          ref: ${{ env.DOVI_TOOL_REV }}
          path: dovi_tool
      - name: Restore Rust build dependencies
        id: linux-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dovi_tool/target
            dovifuse_converter/target
          key: dovifuse-linux-v1-${{ hashFiles('dovifuse_converter/Cargo.lock', 'dovi_tool/Cargo.lock') }}
      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mkvtoolnix mediainfo
      - name: Download prepared disposable media
        uses: actions/download-artifact@v4
        with:
          name: synthetic-mechanics-fixtures
          path: /tmp/dovifuse-ci-fixtures
      - name: Build pinned dovi_tool
        run: |
          cargo build --locked --release --manifest-path dovi_tool/Cargo.toml --no-default-features --features internal-font
          mkdir -p tools
          ln -s ../dovi_tool/target/release/dovi_tool tools/dovi_tool
          ln -s /usr/bin/ffmpeg tools/ffmpeg
      - name: Rust, real tools and wrapper regression gates
        id: linux-tests
        env:
          DOVIFUSE_AUDIT_FIXTURES: /tmp/dovifuse-ci-fixtures
          PYTHONOPTIMIZE: ''
        run: ./scripts/test-linux.sh
      - name: Save Rust build dependencies
        if: always() && steps.linux-tests.outcome == 'success' && steps.linux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dovi_tool/target
            dovifuse_converter/target
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}
      - name: Preserve Linux test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-regression-evidence
          path: |
            /tmp/dovifuse-audit-linux-bundle*/*.json
            /tmp/dovifuse-audit-linux-bundle*/*.log
            /tmp/dovifuse-audit-*/*.log
            /tmp/dovifuse-audit-*/summary.json
            /tmp/dovifuse-audit-*/*.report.json
            /tmp/dovifuse-report-controls-*/*.json
            /tmp/dovifuse-report-controls-*/*.log
            /tmp/dovifuse-rust-tests.*
            /tmp/dovifuse-faults-*/summary.json
            /tmp/dovifuse-faults-*/*/*.log
            /tmp/dovifuse-faults-*/*/report.json
            /tmp/dovifuse-preservation-*/*.log
            /tmp/dovifuse-preservation-*/summary.json
            /tmp/dovifuse-l5-audit-*/*.log
            /tmp/dovifuse-l5-audit-*/summary.json
            /tmp/dovifuse-donor-eligibility-*/*.log
            /tmp/dovifuse-donor-eligibility-*/summary.json
            /tmp/dovifuse-donor-eligibility-*/*.report.json
            /tmp/dovifuse-mapping-*/*.log
            /tmp/dovifuse-mapping-*/summary.json
            /tmp/dovifuse-metadata-*/summary.json
            /tmp/dovifuse-metadata-*/*.log
            /tmp/dovifuse-metadata-*/*.report.json
            /tmp/dovifuse-temporal-*/*.log
            /tmp/dovifuse-temporal-*/*.json
            /tmp/dovifuse-picture-coverage-*/*.log
            /tmp/dovifuse-picture-coverage-*/*.json
            /tmp/dovifuse-reuse-*/summary.json
            /tmp/dovifuse-reuse-*/*.log
            /tmp/dovifuse-reuse-*/report.json
            /tmp/dovifuse-mapping-*/*.report.json

  macos-rendering:
    name: macOS animation regression
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify animation advances without hover
        run: |
          # Hosted macOS enables Reduce Motion; this test exercises motion.
          defaults write com.apple.universalaccess reduceMotion -bool false
          xcrun swiftc -swift-version 6 -strict-concurrency=complete -parse-as-library \
            macapp/DoviFuse/ProcessingMotion.swift \
            macapp/DoviFuse/ProcessingRibbons.swift \
            macapp/DoviFuse/OrganicProcessingField.swift \
            macapp/Tests/ProcessingTimelineRenderingTests.swift -o /tmp/dovifuse-animation-test
          /tmp/dovifuse-animation-test

  macos:
    name: Build, test and package Apple Silicon app
    needs: fixtures
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch pinned dovi_tool source
        uses: actions/checkout@v4
        with:
          repository: quietvoid/dovi_tool
          ref: ${{ env.DOVI_TOOL_REV }}
          path: dovi_tool

      - name: Download prepared disposable media
        uses: actions/download-artifact@v4
        with:
          name: synthetic-mechanics-fixtures
          path: /tmp/dovifuse-ci-fixtures

      - name: Restore native build dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .macos-build-cache/cargo
            .macos-build-cache/rustup
            .macos-build-cache/downloads
            .macos-build-cache/stage
            .macos-build-cache/ffmpeg-*
            dovi_tool/target
          key: dovifuse-macos-deps-v2-${{ hashFiles('macapp/build-macos-app.sh', 'dovifuse_converter/Cargo.lock', 'dovi_tool/Cargo.lock') }}
          restore-keys: |
            dovifuse-macos-deps-v2-

      - name: Build self-contained app
        run: |
          DEVELOPER_DIR="$(xcode-select -p)" ./macapp/build-macos-app.sh

      # Preserve a successful dependency build even if a later regression fails.
      - name: Save native build dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .macos-build-cache/cargo
            .macos-build-cache/rustup
            .macos-build-cache/downloads
            .macos-build-cache/stage
            .macos-build-cache/ffmpeg-*
            dovi_tool/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Test packaged tools and app state
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          export DEVELOPER_DIR="$(xcode-select -p)"
          ./scripts/test-macos-bundle.sh "dist/DoviFuse.app" /tmp/dovifuse-ci-fixtures

      - name: Preserve Mac test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-regression-evidence
          path: |
            /tmp/dovifuse-audit-macos-bundle*/*.json
            /tmp/dovifuse-audit-macos-bundle*/*.log
            /tmp/dovifuse-storage-*/summary.json
            /tmp/dovifuse-storage-*/*.log
            /tmp/dovifuse-storage-*/*.json
            /tmp/dovifuse-audit-*/*.log
            /tmp/dovifuse-audit-*/summary.json
            /tmp/dovifuse-audit-*/*.report.json
            /tmp/dovifuse-report-controls-*/*.json
            /tmp/dovifuse-report-controls-*/*.log
            /tmp/dovifuse-faults-*/summary.json
            /tmp/dovifuse-faults-*/*/*.log
            /tmp/dovifuse-faults-*/*/report.json
            /tmp/dovifuse-preservation-*/*.log
            /tmp/dovifuse-preservation-*/summary.json
            /tmp/dovifuse-l5-audit-*/*.log
            /tmp/dovifuse-l5-audit-*/summary.json
            /tmp/dovifuse-donor-eligibility-*/*.log
            /tmp/dovifuse-donor-eligibility-*/summary.json
            /tmp/dovifuse-donor-eligibility-*/*.report.json
            /tmp/dovifuse-mapping-*/*.log
            /tmp/dovifuse-mapping-*/summary.json
            /tmp/dovifuse-metadata-*/summary.json
            /tmp/dovifuse-metadata-*/*.log
            /tmp/dovifuse-metadata-*/*.report.json
            /tmp/dovifuse-temporal-*/*.log
            /tmp/dovifuse-temporal-*/*.json
            /tmp/dovifuse-picture-coverage-*/*.log
            /tmp/dovifuse-picture-coverage-*/*.json
            /tmp/dovifuse-reuse-*/summary.json
            /tmp/dovifuse-reuse-*/*.log
            /tmp/dovifuse-reuse-*/report.json
            /tmp/dovifuse-mapping-*/*.report.json

      - name: Record acceptance status
        run: |
          python3 scripts/verify_reference_catalog.py > /tmp/dovifuse-acceptance.json
          {
            echo '### Release acceptance'
            echo 'Downloads require passing build and regression checks.'
            echo 'The validated channel additionally requires all acceptance evidence.'
            echo '```json'
            cat /tmp/dovifuse-acceptance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require acceptance evidence for a validated release
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel == 'validated'
        run: python3 scripts/verify_reference_catalog.py --release

      - name: Create and verify DMG
        run: ./macapp/create-dmg.sh

      - name: Package release sources
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/package_release_sources.py --output dist

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/DoviFuse-arm64.dmg
            dist/DoviFuse-arm64.dmg.sha256
            dist/DoviFuse-sources.tar.gz
            dist/DoviFuse-sources.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish verified DMG
    needs: [fixtures, linux, macos-rendering, macos]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reference catalog for additional acceptance verification
        if: inputs.release_channel == 'validated'
        uses: actions/checkout@v4
        with:
          repository: quietvoid/dovi_tool
          ref: ${{ env.DOVI_TOOL_REV }}
          path: dovi_tool
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist
      - name: Publish release with checksums and sources
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'build' }}
        run: ./scripts/publish-release.sh
